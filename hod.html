<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Songs by head of delegation</title>
<style>
  :root {
    --sheet: #f4efe6;
    --ink: #1b1814;
    --muted: #6e665c;
    --faint: #978e82;
    --line: #ddd4c6;
    --line-strong: #1b1814;
    --accent: #9d3418;
    --hot: #ebe3d4;
    --empty: #e4dcd0;
    --serif: "Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --sans: "Avenir Next", Avenir, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sheet: #141210;
      --ink: #f4efe6;
      --muted: #b7aea1;
      --faint: #b3aa9e;
      --line: #2e2a24;
      --line-strong: #f4efe6;
      --accent: #ff7d5c;
      --hot: #241e18;
      --empty: #221c17;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--sheet);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.45;
  }
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 8px 40px 72px;
  }
  .bar {
    position: sticky;
    top: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    padding: 14px 0 12px;
    background: var(--sheet);
  }
  .brand {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px 18px;
  }
  .brand a {
    color: var(--muted);
    font-size: 14px;
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 1px;
  }
  .brand a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .brand a.mark {
    color: var(--ink);
    font-family: var(--serif);
    font-style: italic;
    font-size: 20px;
    letter-spacing: -0.02em;
    border-bottom: 0;
    padding-bottom: 0;
  }
  .brand a.mark:hover { color: var(--accent); }
  .controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 10px;
  }
  .hodpick select, .sortline select {
    appearance: none;
    -webkit-appearance: none;
    height: 40px;
    max-width: 240px;
    padding: 0 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  .sortline { display: flex; align-items: center; gap: 12px; }
  .sortline button {
    appearance: none;
    border: 0;
    border-bottom: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font: inherit;
    font-size: 14px;
    padding: 4px 0;
    cursor: pointer;
    white-space: nowrap;
  }
  button:focus-visible, select:focus-visible, a:focus-visible, th:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .hero { padding: 22px 0 22px; }
  .kicker {
    margin: 0 0 12px;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2.75rem, 5.4vw, 4.25rem);
    line-height: 0.92;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }
  .credit {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 16px;
  }
  .rule {
    margin: 10px 0 0;
    max-width: 68ch;
    color: var(--faint);
    font-size: 13px;
  }
  .people {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    border-top: 1px solid var(--line-strong);
  }
  .people li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 8px 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .people a {
    color: var(--ink);
    font-family: var(--serif);
    font-size: 22px;
    letter-spacing: -0.02em;
    text-decoration: none;
  }
  .people a:hover { color: var(--accent); }
  .count { color: var(--faint); font-variant-numeric: tabular-nums; }
  .boardwrap { overflow-x: auto; border-top: 1px solid var(--line-strong); }
  table { width: 100%; min-width: 760px; border-collapse: collapse; }
  caption.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  th, td {
    padding: 11px 8px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: baseline;
  }
  thead th {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  thead th.sorted, thead th.sorted .arrow { color: var(--accent); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.edition { white-space: nowrap; color: var(--muted); }
  td.edition a, td.country a, .card a.country, .song-block h3 a, a.artist {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid var(--line);
  }
  td.edition a:hover, td.country a:hover, .card a.country:hover, .song-block h3 a:hover, a.artist:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  td.place { font-family: var(--serif); font-size: 18px; white-space: nowrap; }
  td.place .of { color: var(--faint); font-family: var(--sans); font-size: 12px; }
  tr.winner td.place, tr.winner td.points { color: var(--accent); }
  td.ev { color: var(--muted); white-space: nowrap; }
  td.song { font-family: var(--serif); font-size: 18px; line-height: 1.25; }
  a.song { color: inherit; text-decoration: none; }
  a.song:hover { color: var(--accent); }
  td.points { font-weight: 600; white-space: nowrap; }
  tbody tr:hover td { background: var(--hot); }
  .cards { display: none; }
  @media (max-width: 860px) {
    main { padding: 0 18px 56px; }
    .controls, .hodpick, .sortline, .hodpick select, .sortline select { width: 100%; max-width: none; }
    .sortline { justify-content: space-between; }
    .boardwrap { display: none; }
    .cards { display: block; border-top: 1px solid var(--line-strong); }
    .card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .card .top {
      display: flex;
      gap: 10px;
      align-items: baseline;
      color: var(--muted);
      font-size: 13px;
    }
    .card .place { font-family: var(--serif); font-size: 18px; color: var(--ink); }
    .card .of { color: var(--faint); font-family: var(--sans); font-size: 12px; }
    .card .score { text-align: right; }
    .card .points {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      font-size: 16px;
    }
    .card .ev {
      color: var(--faint);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .card .country {
      grid-column: 1 / -1;
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .card .song {
      grid-column: 1 / -1;
      font-family: var(--serif);
      font-size: 20px;
      line-height: 1.2;
    }
    .card .artist { grid-column: 1 / -1; color: var(--faint); font-size: 13px; }
    .card.winner .place, .card.winner .points { color: var(--accent); }
    .card a.ed { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
    .card a.ed:hover { color: var(--accent); border-bottom-color: var(--accent); }
  }
  #songmap { margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--line); }
  #songmap h2 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(1.7rem, 3vw, 2.15rem);
    letter-spacing: -0.03em;
  }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 12px; }
  .tools button {
    font: inherit;
    font-size: 14px;
    height: 36px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .tools button.ghost { border-color: transparent; color: var(--muted); }
  .tools button:hover { border-color: var(--accent); color: var(--accent); }
  svg.map {
    display: block;
    width: 100%;
    aspect-ratio: 1000 / 547.2;
    background: var(--sheet);
    border-top: 1px solid var(--line-strong);
    touch-action: pan-y;
    cursor: grab;
  }
  svg.map.zoomed { touch-action: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 12px; color: var(--muted); font-size: 13px; }
  .swatch { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; }
  .song-block { margin-top: 18px; }
  .song-block h3 { margin: 0 0 8px; font-family: var(--serif); font-weight: 400; font-size: 1.35rem; letter-spacing: -0.02em; }
  .pick-list { list-style: none; margin: 0; padding: 0; }
  .pick-list li {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 1px 14px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .pick-list .evn { font-weight: 600; font-variant-numeric: tabular-nums; }
  .pick-list .meta { color: var(--muted); font-size: 13px; }
  .pick-list .title { font-family: var(--serif); font-size: 18px; line-height: 1.25; }
  .pick-list a.title { color: inherit; text-decoration: none; }
  .pick-list a.title:hover { color: var(--accent); }
  .pick-list .artist { color: var(--faint); font-size: 13px; }
  @media (prefers-reduced-motion: no-preference) {
    main { animation: rise .5s ease both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<main>
  <header class="bar">
    <div class="brand">
      <a class="mark" href="index.html">Share the Love</a>
      <a href="scoreboard.html">Scoreboard</a>
    </div>
    <div class="controls">
      <label class="hodpick">
        <select id="who" aria-label="Head of delegation"></select>
      </label>
      <div class="sortline" id="sortline">
        <label>Sort by
          <select id="sort" aria-label="Sort entries"></select>
        </label>
        <button type="button" id="dir"></button>
      </div>
    </div>
  </header>
  <section class="hero">
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <p class="credit" id="credit"></p>
    <p class="rule" id="rule"></p>
  </section>
  <ul class="people" id="people"></ul>
  <div class="boardwrap" id="boardwrap">
    <table id="board">
      <caption class="sr-only" id="caption"></caption>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <div class="cards" id="cards"></div>
  <section id="songmap" hidden>
    <h2>Song map</h2>
    <p class="rule" id="map-blurb"></p>
    <div class="tools">
      <button type="button" id="zoom-in">Zoom in</button>
      <button type="button" class="ghost" id="zoom-out">Zoom out</button>
      <button type="button" class="ghost" id="zoom-reset">Reset zoom</button>
    </div>
    <div id="large-map-wrap"></div>
    <div id="hover-songs"></div>
    <div class="legend" id="map-legend"></div>
    <p class="rule">Shaded land is the song count. England, Scotland, Wales, Northern Ireland, and Malta are dots. The map is a Mercator projection cropped south of 56 degrees.</p>
  </section>
</main>

function preferred(key) {
  return key === "points" || key === "ev" ? -1 : 1;
}

function dirLabel() {
  if (sortKey === "edition") return sortDir === 1 ? "Oldest first" : "Newest first";
  if (sortKey === "place") return sortDir === 1 ? "Best first" : "Last first";
  if (sortKey === "points" || sortKey === "ev") return sortDir === -1 ? "Highest first" : "Lowest first";
  return sortDir === 1 ? "A to Z" : "Z to A";
}

function resolveName() {
  const raw = new URLSearchParams(location.search).get("name");
  if (!raw) return "";
  return names.find((name) => name.localeCompare(raw, "en", { sensitivity: "base" }) === 0) || null;
}

function setName(name) {
  const url = new URL(location.href);
  if (name) url.searchParams.set("name", name);
  else url.searchParams.delete("name");
  if (url.search !== location.search) history.pushState(null, "", url);
  render();
}

function songNode(row) {
  const url = row[7];
  if (!url) return text("span", "song", row[3]);
  const link = text("a", "song", row[3]);
  link.href = url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.title = "Watch on YouTube";
  return link;
}

function editionNode(row, className) {
  const link = text("a", className || "", "STL " + row[0]);
  link.href = "scoreboard.html#" + row[0];
  return link;
}

function countryNode(name) {
  const link = text("a", "country", name);
  link.href = "country.html?name=" + encodeURIComponent(name);
  link.title = "Songs for " + name;
  return link;
}

function text(tag, className, value) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (value != null) node.textContent = value;
  return node;
}

function compare(a, b) {
  const col = COLS.find((item) => item.key === sortKey);
  let diff = col.type === "text"
    ? String(a[col.index]).localeCompare(String(b[col.index]), "en", { sensitivity: "base" })
    : a[col.index] - b[col.index];
  if (diff) return diff * sortDir;
  if (a[0] !== b[0]) return a[0] - b[0];
  return a[1] - b[1];
}

function renderPeople() {
  const list = document.querySelector("#people");
  list.replaceChildren();
  names.forEach((name) => {
    const li = document.createElement("li");
    const link = text("a", "", name);
    link.href = "hod.html?name=" + encodeURIComponent(name);
    link.addEventListener("click", (event) => {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
      event.preventDefault();
      setName(name);
    });
    li.append(link, text("span", "count", String(ENTRIES[name].length)));
    list.appendChild(li);
  });
}

const ARTIST_FOLD = new Map(ARTIST_NAMES.map((name) => [foldArtist(name), name]));
const ARTIST_KEEP = ["Sophie and the Giants", "Of Monsters And Men", "Christine and the Queens", "Florence + The Machine", "Tones and I", "Cali y El Dandee"];
function foldArtist(name) {
  const folded = String(name).replace(/\u00a0/g, " ").normalize("NFKD").replace(/\p{M}/gu, "").toLowerCase().replace(/[^0-9a-z\u0370-\u03ff\u0400-\u04ff]+/giu, " ").replace(/\s+/g, " ").trim();
  return folded === "malou" || folded === "μαλου" ? "malu" : folded;
}
function artistHref(name) {
  return "artist.html?name=" + encodeURIComponent(name);
}
function artistAnchor(shown, canonical) {
  const link = document.createElement("a");
  link.className = "artist";
  link.textContent = shown;
  link.href = artistHref(canonical);
  link.title = canonical + "'s songs";
  link.addEventListener("click", (event) => event.stopPropagation());
  return link;
}
function creditPieces(credit) {
  let text = String(credit).replace(/\u00a0/g, " ");
  const held = [];
  ARTIST_KEEP.forEach((phrase) => {
    const re = new RegExp(phrase.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
    text = text.replace(re, (match) => {
      const token = "\u0001" + held.length + "\u0001";
      held.push(match);
      return token;
    });
  });
  return text.split(/(\s*(?:,|&|\+|feat\.|featuring|\bfeat\b|\bft\.?\b|\band\b)\s*|\s+\/\s+|\s+[xXхХ]\s+)/i).map((bit) => bit.replace(/\u0001(\d+)\u0001/g, (_, index) => held[Number(index)]));
}
function creditFragment(credit) {
  const frag = document.createDocumentFragment();
  creditPieces(credit).forEach((part) => {
    if (!part) return;
    const match = part.match(/^(\s*)([\s\S]*?)(\s*)$/);
    const core = match[2];
    const trimmed = core.replace(/^[^0-9A-Za-z\u00C0-\u024F\u0370-\u03FF\u0400-\u04FF]+/, "");
    const prefix = core.slice(0, core.length - trimmed.length);
    const name = trimmed.replace(/[^0-9A-Za-z\u00C0-\u024F\u0370-\u03FF\u0400-\u04FF]+$/, "");
    const suffix = trimmed.slice(name.length);
    if (match[1]) frag.append(match[1]);
    if (prefix) frag.append(prefix);
    const known = name ? ARTIST_FOLD.get(foldArtist(name)) : "";
    if (known) frag.appendChild(artistAnchor(name, known));
    else if (name) frag.append(name);
    if (suffix) frag.append(suffix);
    if (match[3]) frag.append(match[3]);
  });
  return frag;
}

  const node = document.createElement(tag);
  if (className) node.className = className;
  node.appendChild(creditFragment(credit));
  return node;
}

    const top = document.createElement("div");
    top.className = "top";
    const edition = editionNode(row, "ed");
    const place = text("span", "place");
    place.append(String(row[1]), text("span", "of", " of " + row[6]));
    top.append(edition, place);
    const score = document.createElement("div");
    score.className = "score";
    const ev = text("div", "ev", String(row[8]));
    ev.title = "Eurovision-scale points";
    score.append(text("div", "points", String(row[5])), ev);
    const country = document.createElement("div");
    country.className = "country";
    country.appendChild(countryNode(row[2]));
    const song = document.createElement("div");
    song.className = "song";
    song.appendChild(songNode(row));
    card.append(top, score, country, song, creditCell("div", "artist", row[4]));
    cards.appendChild(card);
  });
}

function choose(key, fromHeader) {
  if (sortKey === key) sortDir *= -1;
  else {
    sortKey = key;
    sortDir = preferred(key);
  }
  render();
  if (!fromHeader) return;
  const th = document.querySelector('thead th[data-sort="' + key + '"]');
  if (th) th.focus();
}

function render() {
  const name = resolveName();
  const rows = name ? ENTRIES[name].slice().sort(compare) : null;
  who.value = name || "";
  sortSelect.value = sortKey;
  dirBtn.textContent = dirLabel();
  document.querySelector("#sortline").hidden = !rows;
  document.querySelector("#people").hidden = !!rows;
  document.querySelector("#boardwrap").hidden = !rows;
  document.querySelector("#cards").hidden = !rows;
  syncMap(rows ? name : "");
  const rule = "Place is the tie-break rank in that edition's full field. Points are the jury total. Eurovision points put that total on a 1,008-point scale.";
  if (!name) {
    const songs = names.reduce((sum, person) => sum + ENTRIES[person].length, 0);
    document.title = "Songs by head of delegation";
    document.querySelector("#kicker").textContent = "STL editions 1–63";
    document.querySelector("#title").textContent = name === null
      ? (new URLSearchParams(location.search).get("name") || "Songs")
      : "Songs";
    document.querySelector("#credit").textContent = name === null
      ? "No entries under that name."
      : songs.toLocaleString("en") + " songs from " + names.length + " heads of delegation.";
    document.querySelector("#rule").textContent = name === null ? "" : "Choose someone to see every song they entered.";
    return;
  }
  const wins = rows.filter((row) => row[1] === 1).length;
  const average = rows.reduce((sum, row) => sum + row[1], 0) / rows.length;
  document.title = name + "'s songs";
  document.querySelector("#kicker").textContent = "Head of delegation · STL 1–63";
  document.querySelector("#title").textContent = name;
  document.querySelector("#credit").textContent = rows.length + (rows.length === 1 ? " song · " : " songs · ")
    + wins + (wins === 1 ? " win · " : " wins · ")
    + "average place " + (Math.round(average * 10) / 10).toFixed(1);
  document.querySelector("#rule").textContent = rule;
  renderTable(rows, name);
}

const MAP_W = 1000;
const MAP_H = MAP.mapH;
const countryId = new Map(MAP.countries.map((country, index) => [country, index]));
let mappedName = "";
let mapView = { x: 0, y: 0, width: MAP_W, height: MAP_H };
let mapGroups = new Map();

function mapColor(count) {
  if (count <= 0) return "var(--empty)";
  const percent = Math.round(22 + 78 * Math.sqrt(count / MAP.maxSongs));
  return "color-mix(in srgb, var(--accent) " + percent + "%, var(--empty))";
}

function readMapView(svg) {
  const parts = (svg.getAttribute("viewBox") || "0 0 " + MAP_W + " " + MAP_H).split(/[\s,]+/).map(Number);
  return { x: parts[0], y: parts[1], width: parts[2], height: parts[3] };
}

function clampMapView(x, y, width) {
  const nextWidth = Math.min(MAP_W, Math.max(40, width));
  const nextHeight = nextWidth * (MAP_H / MAP_W);
  if (nextWidth >= MAP_W - 0.5) return { x: 0, y: 0, width: MAP_W, height: MAP_H };
  return {
    x: Math.min(Math.max(x, 20 - nextWidth), MAP_W - 20),
    y: Math.min(Math.max(y, 20 - nextHeight), MAP_H - 20),
    width: nextWidth,
    height: nextHeight,
  };
}

function writeMapView(svg, view) {
  mapView = view;
  svg.setAttribute("viewBox", view.x + " " + view.y + " " + view.width + " " + view.height);
  svg.classList.toggle("zoomed", view.width < MAP_W - 0.5);
  const scale = view.width / MAP_W;
  svg.querySelectorAll("circle").forEach((circle) => {
    const base = Number(circle.getAttribute("data-r"));
    if (base > 0) circle.setAttribute("r", String(base * scale));
  });
}

function zoomMapAt(svg, clientX, clientY, factor) {
  const rect = svg.getBoundingClientRect();
  const view = readMapView(svg);
  const px = rect.width > 0 ? (clientX - rect.left) / rect.width : 0.5;
  const py = rect.height > 0 ? (clientY - rect.top) / rect.height : 0.5;
  const anchorX = view.x + px * view.width;
  const anchorY = view.y + py * view.height;
  const width = view.width * factor;
  const height = width * (MAP_H / MAP_W);
  writeMapView(svg, clampMapView(anchorX - px * width, anchorY - py * height, width));
}

function bindMapZoom(svg) {
  svg.addEventListener("wheel", (event) => {
    event.preventDefault();
    zoomMapAt(svg, event.clientX, event.clientY, Math.exp(event.deltaY * 0.0015));
  }, { passive: false });
  svg.addEventListener("dblclick", (event) => {
    event.preventDefault();
    zoomMapAt(svg, event.clientX, event.clientY, 1 / 1.8);
  });
  let drag = null;
  svg.addEventListener("pointerdown", (event) => {
    if (event.pointerType === "mouse" && event.button !== 0) return;
    if (event.pointerType !== "mouse" && readMapView(svg).width >= MAP_W - 0.5) return;
    const view = readMapView(svg);
    drag = { id: event.pointerId, x: event.clientX, y: event.clientY, viewX: view.x, viewY: view.y, width: view.width, moved: false };
    svg.setPointerCapture(event.pointerId);
    if (event.pointerType === "mouse") svg.style.cursor = "grabbing";
  });
  svg.addEventListener("pointermove", (event) => {
    if (!drag || event.pointerId !== drag.id) return;
    if (Math.hypot(event.clientX - drag.x, event.clientY - drag.y) > 6) drag.moved = true;
    const rect = svg.getBoundingClientRect();
    const dx = rect.width > 0 ? ((event.clientX - drag.x) / rect.width) * drag.width : 0;
    const dy = rect.height > 0 ? ((event.clientY - drag.y) / rect.height) * drag.height : 0;
    writeMapView(svg, clampMapView(drag.viewX - dx, drag.viewY - dy, drag.width));
  });
  const endDrag = (event) => {
    if (!drag || event.pointerId !== drag.id) return;
    if (drag.moved) svg.dataset.skipClick = "1";
    drag = null;
    svg.style.cursor = "grab";
  };
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);
  let pinch = null;
  svg.addEventListener("touchstart", (event) => {
    if (event.touches.length !== 2) return;
    event.preventDefault();
    drag = null;
    const [a, b] = event.touches;
    pinch = {
      dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1,
      view: readMapView(svg),
      cx: (a.clientX + b.clientX) / 2,
      cy: (a.clientY + b.clientY) / 2,
    };
  }, { passive: false });
  svg.addEventListener("touchmove", (event) => {
    if (!pinch || event.touches.length < 2) return;
    event.preventDefault();
    const [a, b] = event.touches;
    const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1;
    const cx = (a.clientX + b.clientX) / 2;
    const cy = (a.clientY + b.clientY) / 2;
    const rect = svg.getBoundingClientRect();
    const ox = rect.width > 0 ? (pinch.cx - rect.left) / rect.width : 0.5;
    const oy = rect.height > 0 ? (pinch.cy - rect.top) / rect.height : 0.5;
    const px = rect.width > 0 ? (cx - rect.left) / rect.width : 0.5;
    const py = rect.height > 0 ? (cy - rect.top) / rect.height : 0.5;
    const anchorX = pinch.view.x + ox * pinch.view.width;
    const anchorY = pinch.view.y + oy * pinch.view.height;
    const width = pinch.view.width * (pinch.dist / dist);
    const height = width * (MAP_H / MAP_W);
    writeMapView(svg, clampMapView(anchorX - px * width, anchorY - py * height, width));
    svg.dataset.skipClick = "1";
  }, { passive: false });
  svg.addEventListener("touchend", (event) => {
    if (event.touches.length < 2) pinch = null;
  });
  svg.addEventListener("click", (event) => {
    if (svg.dataset.skipClick === "1") {
      svg.dataset.skipClick = "";
      return;
    }
    const target = event.target.closest("[data-pick]");
    if (!target || !svg.contains(target)) return;
    showCountrySongs(target.dataset.pick);
  });
}

function showCountrySongs(picked) {
  const host = document.querySelector("#hover-songs");
  host.replaceChildren();
  picked.split(",").map(Number).forEach((id) => {
    const songs = mapGroups.get(id);
    if (!songs) return;
    const block = document.createElement("div");
    block.className = "song-block";
    const heading = document.createElement("h3");
    const countryLink = text("a", "", MAP.countries[id]);
    countryLink.href = "country.html?name=" + encodeURIComponent(MAP.countries[id]);
    countryLink.title = "Songs for " + MAP.countries[id];
    heading.append(countryLink, " · " + songs.length + (songs.length === 1 ? " song" : " songs"));
    const list = document.createElement("ul");
    list.className = "pick-list";
    songs.slice(0, 5).forEach((row) => {
      const item = document.createElement("li");
      const score = text("span", "evn", String(row[8]));
      const body = document.createElement("div");
      body.appendChild(text("div", "meta", row[1] + " of " + row[6] + " · STL " + row[0]));
      const title = row[7] ? text("a", "title", row[3]) : text("div", "title", row[3]);
      if (row[7]) {
        title.href = row[7];
        title.target = "_blank";
        title.rel = "noopener noreferrer";
      }
      body.append(title, creditCell("div", "artist", row[4]));
      item.append(score, body);
      list.appendChild(item);
    });
    block.append(heading, list);
    host.appendChild(block);
  });
}

function paintPersonMap(name, rows) {
  mapGroups = new Map();
  rows.forEach((row) => {
    const id = countryId.get(row[2]);
    if (id == null) return;
    if (!mapGroups.has(id)) mapGroups.set(id, []);
    mapGroups.get(id).push(row);
  });
  mapGroups.forEach((list) => list.sort((a, b) => b[8] - a[8] || a[1] - b[1] || b[0] - a[0]));
  const countries = mapGroups.size;
  document.querySelector("#map-blurb").textContent = rows.length + (rows.length === 1 ? " song" : " songs")
    + " in " + countries + (countries === 1 ? " country. " : " countries. ")
    + "Click a country for the five highest Eurovision-scale scores there. The country name opens every song.";
  const svg = document.querySelector("#large-map");
  const ns = "http://www.w3.org/2000/svg";
  svg.setAttribute("aria-label", "Songs entered by " + name);
  svg.replaceChildren();
  const ocean = document.createElementNS(ns, "rect");
  ocean.setAttribute("x", -MAP_W);
  ocean.setAttribute("y", -MAP_H);
  ocean.setAttribute("width", MAP_W * 3);
  ocean.setAttribute("height", MAP_H * 3);
  ocean.setAttribute("fill", "var(--sheet)");
  svg.appendChild(ocean);
  MAP.shapes.forEach((shape) => {
    const active = shape.ids.filter((id) => mapGroups.has(id));
    const count = active.reduce((sum, id) => sum + mapGroups.get(id).length, 0);
    const path = document.createElementNS(ns, "path");
    path.setAttribute("d", shape.d);
    path.setAttribute("fill", count > 0 ? mapColor(count) : "var(--empty)");
    path.setAttribute("stroke", "var(--line)");
    path.setAttribute("stroke-width", "0.8");
    path.setAttribute("vector-effect", "non-scaling-stroke");
    path.style.cursor = count > 0 ? "pointer" : "grab";
    if (count > 0) path.dataset.pick = active.join(",");
    svg.appendChild(path);
  });
  const scale = mapView.width / MAP_W;
  MAP.dots.forEach((dot) => {
    const songs = mapGroups.get(dot.id);
    if (!songs) return;
    const radius = 11 + 14 * Math.sqrt(songs.length / 31);
    const circle = document.createElementNS(ns, "circle");
    circle.setAttribute("cx", dot.x);
    circle.setAttribute("cy", dot.y);
    circle.setAttribute("r", radius * scale);
    circle.setAttribute("data-r", radius);
    circle.setAttribute("fill", mapColor(songs.length));
    circle.setAttribute("stroke", "var(--ink)");
    circle.setAttribute("stroke-width", "1.4");
    circle.setAttribute("vector-effect", "non-scaling-stroke");
    circle.dataset.pick = String(dot.id);
    circle.style.cursor = "pointer";
    svg.appendChild(circle);
  });
  writeMapView(svg, { x: 0, y: 0, width: MAP_W, height: MAP_H });
  document.querySelector("#hover-songs").replaceChildren();
}

function syncMap(name) {
  const section = document.querySelector("#songmap");
  if (!name) {
    section.hidden = true;
    mappedName = "";
    return;
  }
  section.hidden = false;
  if (name === mappedName) return;
  mappedName = name;
  paintPersonMap(name, ENTRIES[name]);
}

const mapSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
mapSvg.id = "large-map";
mapSvg.setAttribute("class", "map");
mapSvg.setAttribute("role", "img");
document.querySelector("#large-map-wrap").appendChild(mapSvg);
bindMapZoom(mapSvg);
document.querySelector("#zoom-in").onclick = () => {
  const rect = mapSvg.getBoundingClientRect();
  zoomMapAt(mapSvg, rect.left + rect.width / 2, rect.top + rect.height / 2, 1 / 1.35);
};
document.querySelector("#zoom-out").onclick = () => {
  const rect = mapSvg.getBoundingClientRect();
  zoomMapAt(mapSvg, rect.left + rect.width / 2, rect.top + rect.height / 2, 1.35);
};
document.querySelector("#zoom-reset").onclick = () => writeMapView(mapSvg, { x: 0, y: 0, width: MAP_W, height: MAP_H });
document.querySelector("#map-legend").innerHTML = "<span>Songs</span>" + [0, 1, 3, 8, 15, 30, MAP.maxSongs].map((count) =>
  '<span><i class="swatch" style="background:' + mapColor(count) + '"></i> ' + count + "</span>").join("");

who.addEventListener("change", () => setName(who.value));
sortSelect.addEventListener("change", () => choose(sortSelect.value, false));
dirBtn.addEventListener("click", () => {
  sortDir *= -1;
  render();
});
window.addEventListener("popstate", render);
renderPeople();
render();
</script>
</body>
</html>
