<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Songs by country</title>
<style>
  :root {
    --sheet: #f4efe6;
    --ink: #1b1814;
    --muted: #6e665c;
    --faint: #978e82;
    --line: #ddd4c6;
    --line-strong: #1b1814;
    --accent: #9d3418;
    --hot: #ebe3d4;
    --serif: "Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --sans: "Avenir Next", Avenir, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sheet: #141210;
      --ink: #f4efe6;
      --muted: #b7aea1;
      --faint: #b3aa9e;
      --line: #2e2a24;
      --line-strong: #f4efe6;
      --accent: #ff7d5c;
      --hot: #241e18;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--sheet);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.45;
  }
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 8px 40px 72px;
  }
  .bar {
    position: sticky;
    top: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    padding: 14px 0 12px;
    background: var(--sheet);
  }
  .brand {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px 18px;
  }
  .brand a {
    color: var(--muted);
    font-size: 14px;
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 1px;
  }
  .brand a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .brand a.mark {
    color: var(--ink);
    font-family: var(--serif);
    font-style: italic;
    font-size: 20px;
    letter-spacing: -0.02em;
    border-bottom: 0;
    padding-bottom: 0;
  }
  .brand a.mark:hover { color: var(--accent); }
  .controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 10px;
  }
  .countrypick select, .sortline select {
    appearance: none;
    -webkit-appearance: none;
    height: 40px;
    max-width: 360px;
    padding: 0 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  .sortline { display: flex; align-items: center; gap: 12px; }
  .sortline button {
    appearance: none;
    border: 0;
    border-bottom: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font: inherit;
    font-size: 14px;
    padding: 4px 0;
    cursor: pointer;
    white-space: nowrap;
  }
  button:focus-visible, select:focus-visible, a:focus-visible, th:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .hero { padding: 22px 0 22px; }
  .kicker {
    margin: 0 0 12px;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2.2rem, 5.4vw, 4.25rem);
    line-height: 0.96;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }
  .credit {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 16px;
  }
  .rule {
    margin: 10px 0 0;
    max-width: 68ch;
    color: var(--faint);
    font-size: 13px;
  }
  .people {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    border-top: 1px solid var(--line-strong);
  }
  .people li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 8px 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .people a {
    color: var(--ink);
    font-family: var(--serif);
    font-size: 22px;
    letter-spacing: -0.02em;
    text-decoration: none;
  }
  .people a:hover { color: var(--accent); }
  .count { color: var(--faint); font-variant-numeric: tabular-nums; }
  .boardwrap { overflow-x: auto; border-top: 1px solid var(--line-strong); }
  table { width: 100%; min-width: 760px; border-collapse: collapse; }
  caption.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  th, td {
    padding: 11px 8px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: baseline;
  }
  thead th {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  thead th.sorted, thead th.sorted .arrow { color: var(--accent); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.edition { white-space: nowrap; color: var(--muted); }
  td.edition a, a.hod, a.artist {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid var(--line);
  }
  td.edition a:hover, a.hod:hover, a.artist:hover { color: var(--accent); border-bottom-color: var(--accent); }
  td.place { font-family: var(--serif); font-size: 18px; white-space: nowrap; }
  td.place .of { color: var(--faint); font-family: var(--sans); font-size: 12px; }
  tr.winner td.place, tr.winner td.points { color: var(--accent); }
  td.ev { color: var(--muted); white-space: nowrap; }
  td.song { font-family: var(--serif); font-size: 18px; line-height: 1.25; }
  a.song { color: inherit; text-decoration: none; }
  a.song:hover { color: var(--accent); }
  td.points { font-weight: 600; white-space: nowrap; }
  tbody tr:hover td { background: var(--hot); }
  .cards { display: none; }
  @media (max-width: 860px) {
    main { padding: 0 18px 56px; }
    .controls, .countrypick, .sortline, .countrypick select, .sortline select { width: 100%; max-width: none; }
    .sortline { justify-content: space-between; }
    .boardwrap { display: none; }
    .cards { display: block; border-top: 1px solid var(--line-strong); }
    .card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .card .top {
      display: flex;
      gap: 10px;
      align-items: baseline;
      color: var(--muted);
      font-size: 13px;
    }
    .card .place { font-family: var(--serif); font-size: 18px; color: var(--ink); }
    .card .of { color: var(--faint); font-family: var(--sans); font-size: 12px; }
    .card .score { text-align: right; }
    .card .points {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      font-size: 16px;
    }
    .card .ev {
      color: var(--faint);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .card .who {
      grid-column: 1 / -1;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    .card .song {
      grid-column: 1 / -1;
      font-family: var(--serif);
      font-size: 20px;
      line-height: 1.2;
    }
    .card .artist { grid-column: 1 / -1; color: var(--faint); font-size: 13px; }
    .card.winner .place, .card.winner .points { color: var(--accent); }
    .card a.ed { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
    .card a.ed:hover { color: var(--accent); border-bottom-color: var(--accent); }
  }
  @media (prefers-reduced-motion: no-preference) {
    main { animation: rise .5s ease both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<main>
  <header class="bar">
    <div class="brand">
      <a class="mark" href="index.html">Share the Love</a>
      <a href="scoreboard.html">Scoreboard</a>
    </div>
    <div class="controls">
      <label class="countrypick">
        <select id="who" aria-label="Country"></select>
      </label>

        <label>Sort by

        </label>
        <button type="button" id="dir"></button>
      </div>
    </div>
  </header>
  <section class="hero">
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <p class="credit" id="credit"></p>
    <p class="rule" id="rule"></p>
  </section>
  <ul class="people" id="people"></ul>
  <div class="boardwrap" id="boardwrap">
    <table id="board">
      <caption class="sr-only" id="caption"></caption>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <div class="cards" id="cards"></div>
</main>

function preferred(key) {
  return key === "points" || key === "ev" ? -1 : 1;
}

function dirLabel() {
  if (sortKey === "edition") return sortDir === 1 ? "Oldest first" : "Newest first";

function resolveName() {
  const raw = new URLSearchParams(location.search).get("name");
  if (!raw) return "";
  return countries.find((name) => name.localeCompare(raw, "en", { sensitivity: "base" }) === 0) || null;
}

function setName(name) {
  const url = new URL(location.href);
  if (name) url.searchParams.set("name", name);
  else url.searchParams.delete("name");
  if (url.search !== location.search) history.pushState(null, "", url);
  render();
}

  link.title = "Watch on YouTube";

function text(tag, className, value) {

  const col = COLS.find((item) => item.key === sortKey);

    : a[col.index] - b[col.index];
  if (diff) return diff * sortDir;
  if (a[0] !== b[0]) return a[0] - b[0];

      song,
      creditCell("td", "artist", row[4]),
      text("td", "num points", String(row[5])),
      text("td", "num ev", String(row[8]))
    );
    body.appendChild(tr);
  });
  document.querySelector("#caption").textContent = "Songs for " + name + ", sortable by edition, place, head of delegation, song, artist, points, and Eurovision points";

  const cards = document.querySelector("#cards");
  cards.replaceChildren();
  rows.forEach((row) => {
    const card = document.createElement("article");
    card.className = "card" + (row[1] === 1 ? " winner" : "");
    const top = document.createElement("div");
    top.className = "top";
    const edition = editionNode(row, "ed");
    const place = text("span", "place");
    place.append(String(row[1]), text("span", "of", " of " + row[6]));
    top.append(edition, place);
    const score = document.createElement("div");
    score.className = "score";
    const ev = text("div", "ev", String(row[8]));
    ev.title = "Eurovision-scale points";
    score.append(text("div", "points", String(row[5])), ev);
    const whoLine = document.createElement("div");
    whoLine.className = "who";
    whoLine.appendChild(hodNode(row[2]));
    const song = document.createElement("div");
    song.className = "song";
    song.appendChild(songNode(row));
    card.append(top, score, whoLine, song, creditCell("div", "artist", row[4]));
    cards.appendChild(card);
  });
}

function choose(key, fromHeader) {
  if (sortKey === key) sortDir *= -1;
  else {
    sortKey = key;
    sortDir = preferred(key);
  }
  render();
  if (!fromHeader) return;
  const th = document.querySelector('thead th[data-sort="' + key + '"]');
  if (th) th.focus();
}

function render() {
  const name = resolveName();
  const rows = name ? SONGS[name].slice().sort(compare) : null;
  who.value = name || "";
  sortSelect.value = sortKey;
  dirBtn.textContent = dirLabel();
  document.querySelector("#sortline").hidden = !rows;
  document.querySelector("#people").hidden = !!rows;
  document.querySelector("#boardwrap").hidden = !rows;
  document.querySelector("#cards").hidden = !rows;
  const rule = "Place is the tie-break rank in that edition's full field. Points are the jury total. Eurovision points put that total on a 1,008-point scale.";
  if (!name) {
    const songs = countries.reduce((sum, country) => sum + SONGS[country].length, 0);
    document.title = "Songs by country";
    document.querySelector("#kicker").textContent = "STL editions 1–63";
    document.querySelector("#title").textContent = name === null
      ? (new URLSearchParams(location.search).get("name") || "Songs")
      : "Countries";
    document.querySelector("#credit").textContent = name === null
      ? "No entries for that country."
      : songs.toLocaleString("en") + " songs from " + countries.length + " countries.";
    document.querySelector("#rule").textContent = name === null ? "" : "Choose a country to see every song entered for it.";
    return;
  }
  const wins = rows.filter((row) => row[1] === 1).length;
  const average = rows.reduce((sum, row) => sum + row[1], 0) / rows.length;
  const people = new Set(rows.map((row) => row[2])).size;
  document.title = "Songs for " + name;
  document.querySelector("#kicker").textContent = "Country · STL 1–63";
  document.querySelector("#title").textContent = name;
  document.querySelector("#credit").textContent = rows.length + (rows.length === 1 ? " song · " : " songs · ")
    + wins + (wins === 1 ? " win · " : " wins · ")
    + "average place " + (Math.round(average * 10) / 10).toFixed(1) + " · "
    + people + (people === 1 ? " head of delegation" : " heads of delegation");
  document.querySelector("#rule").textContent = rule;
  renderTable(rows, name);
}

who.addEventListener("change", () => setName(who.value));
sortSelect.addEventListener("change", () => choose(sortSelect.value, false));
dirBtn.addEventListener("click", () => {
  sortDir *= -1;
  render();
});
window.addEventListener("popstate", render);
renderPeople();
render();
</script>
</body>
</html>
