<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Songs by artist</title>
<style>
  :root {
    --sheet: #f4efe6;
    --ink: #1b1814;
    --muted: #6e665c;
    --faint: #978e82;
    --line: #ddd4c6;
    --line-strong: #1b1814;
    --accent: #9d3418;
    --hot: #ebe3d4;
    --serif: "Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --sans: "Avenir Next", Avenir, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sheet: #141210;
      --ink: #f4efe6;
      --muted: #b7aea1;
      --faint: #b3aa9e;
      --line: #2e2a24;
      --line-strong: #f4efe6;
      --accent: #ff7d5c;
      --hot: #241e18;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--sheet);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.45;
  }
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 8px 40px 72px;
  }
  .bar {
    position: sticky;
    top: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    padding: 14px 0 12px;
    background: var(--sheet);
  }
  .brand {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px 18px;
  }
  .brand a {
    color: var(--muted);
    font-size: 14px;
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 1px;
  }
  .brand a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .brand a.mark {
    color: var(--ink);
    font-family: var(--serif);
    font-style: italic;
    font-size: 20px;
    letter-spacing: -0.02em;
    border-bottom: 0;
    padding-bottom: 0;
  }
  .brand a.mark:hover { color: var(--accent); }
  .controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 10px;
  }
  .artistpick select, .sortline select {
    appearance: none;
    -webkit-appearance: none;
    height: 40px;
    max-width: 360px;
    padding: 0 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  .sortline { display: flex; align-items: center; gap: 12px; }
  .sortline button {
    appearance: none;
    border: 0;
    border-bottom: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font: inherit;
    font-size: 14px;
    padding: 4px 0;
    cursor: pointer;
    white-space: nowrap;
  }
  button:focus-visible, select:focus-visible, a:focus-visible, th:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .hero { padding: 22px 0 22px; }
  .kicker {
    margin: 0 0 12px;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2.2rem, 5.4vw, 4.25rem);
    line-height: 0.96;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }
  .credit {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 16px;
  }
  .rule {
    margin: 10px 0 0;
    max-width: 68ch;
    color: var(--faint);
    font-size: 13px;
  }
  .people {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    border-top: 1px solid var(--line-strong);
  }
  .people li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 8px 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .people a {
    color: var(--ink);
    font-family: var(--serif);
    font-size: 22px;
    letter-spacing: -0.02em;
    text-decoration: none;
  }
  .people a:hover { color: var(--accent); }
  .count { color: var(--faint); font-variant-numeric: tabular-nums; }
  .boardwrap { overflow-x: auto; border-top: 1px solid var(--line-strong); }
  table { width: 100%; min-width: 920px; border-collapse: collapse; }
  caption.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  th, td {
    padding: 11px 8px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: baseline;
  }
  thead th {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  thead th.sorted, thead th.sorted .arrow { color: var(--accent); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.edition { white-space: nowrap; color: var(--muted); }
  td.edition a, a.hod, a.country, a.artist {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid var(--line);
  }
  td.edition a:hover, a.hod:hover, a.country:hover, a.artist:hover { color: var(--accent); border-bottom-color: var(--accent); }
  td.place { font-family: var(--serif); font-size: 18px; white-space: nowrap; }
  td.place .of { color: var(--faint); font-family: var(--sans); font-size: 12px; }
  tr.winner td.place, tr.winner td.points { color: var(--accent); }
  td.ev { color: var(--muted); white-space: nowrap; }
  td.song { font-family: var(--serif); font-size: 18px; line-height: 1.25; }
  a.song { color: inherit; text-decoration: none; }
  a.song:hover { color: var(--accent); }
  td.points { font-weight: 600; white-space: nowrap; }
  tbody tr:hover td { background: var(--hot); }
  .cards { display: none; }
  @media (max-width: 860px) {
    main { padding: 0 18px 56px; }
    .controls, .artistpick, .sortline, .artistpick select, .sortline select { width: 100%; max-width: none; }
    .sortline { justify-content: space-between; }
    .boardwrap { display: none; }
    .cards { display: block; border-top: 1px solid var(--line-strong); }
    .card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .card .top {
      display: flex;
      gap: 10px;
      align-items: baseline;
    }
    .card .ed { color: var(--muted); font-size: 13px; }
    .card .place { font-family: var(--serif); font-size: 18px; color: var(--ink); }
    .card .of { color: var(--faint); font-family: var(--sans); font-size: 12px; }
    .card .score { text-align: right; }
    .card .points {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      font-size: 16px;
    }
    .card .ev {
      color: var(--faint);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .card .who {
      grid-column: 1 / -1;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    .card .song {
      grid-column: 1 / -1;
      font-family: var(--serif);
      font-size: 20px;
      line-height: 1.2;
    }
    .card .credit { grid-column: 1 / -1; color: var(--faint); font-size: 13px; }
    .card.winner .place, .card.winner .points { color: var(--accent); }
    .card a.ed { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
    .card a.ed:hover { color: var(--accent); border-bottom-color: var(--accent); }
  }
  @media (prefers-reduced-motion: no-preference) {
    main { animation: rise .5s ease both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
</style>
</head>

  <ul class="people" id="people"></ul>

</main>

const artists = Object.keys(SONGS).sort((a, b) => a.localeCompare(b, "en", { sensitivity: "base" }));
let sortKey = "place";
let sortDir = 1;
const COLS = [
  { key: "edition", label: "Edition", index: 0, type: "num" },
  { key: "place", label: "Place", index: 1, type: "num", title: "Tie-break rank" },
  { key: "country", label: "Country", index: 2, type: "text" },
  { key: "hod", label: "Entered by", index: 3, type: "text", title: "Head of delegation" },
  { key: "song", label: "Song", index: 4, type: "text" },
  { key: "credit", label: "Credit", index: 5, type: "text" },
  { key: "points", label: "Points", index: 6, type: "num" },
  { key: "ev", label: "Eurovision", index: 9, type: "num", title: "Jury points on a 1,008-point scale" }
];

const who = document.querySelector("#who");
const sortSelect = document.querySelector("#sort");
const dirBtn = document.querySelector("#dir");
const everyone = document.createElement("option");
everyone.value = "";
everyone.textContent = "All artists";
who.appendChild(everyone);
artists.forEach((name) => {
  const option = document.createElement("option");
  option.value = name;
  option.textContent = name;
  who.appendChild(option);
});
COLS.forEach((col) => {
  const option = document.createElement("option");
  option.value = col.key;
  option.textContent = col.label;
  sortSelect.appendChild(option);
});

const ARTIST_NAMES = ["AIDAN","Aitana","Alexia Evellyn","Alvaro Soler","Ana Mena","Anastasia","Antigoni","Artem Pivovarov","Artemas","Aura Dione","Ava Max","Avril Lavigne","Ayliva","Azahriah","Bad Bunny","BESS","Billie Eilish","Birdy","BLACKPINK","Bobi Andonov","Breskvica","Calema","Calum Scott","Calvin Harris","Camille","Carolina Deslandes","Charli XCX","Charlotte Cardin","Cian Ducrot","Conan Gray","Dagny","David Guetta","Davina Michelle","Dean Lewis","Demi Lovato","Dhurata Dora","Dotan","Dua Lipa","Džejla Ramović","Edis","Ella Eyre","Ella Henderson","Elvana Gjata","Emeli Sandé","Emilia","Emma Heesters","ENISA","Evangelia","Faouzia","Federico Rossi","Fedez","Fernando Daniel","Freya Ridings","Gaia","Galena","Grace Carter","Haloo Helsinki!","Hecht","Hozier","ICEGUYS","ILIRA","Ilta","Indila","INNA","Irina Rimes","J Balvin","Jamie Miller","Jessica Shy","Josephine","Kabouter Plop","Karl-Erik Taukar","KAZKA","Kendji Girac","Khalid","Konstantinos Argiros","Konstantinos Koufos","Lachie Gill","Lady Gaga","Laufey","Lewis Capaldi","Liamoo","Liis Lemsalu","Lilit Hovhannisyan","Lola Indigo","Lorde","Luis Fonsi","LÉON","Malu","Maluma","MARINA","Martin Garrix","Mathea","Mating Ritual","Max Barskih","May Sfadia","Maëlle","Maître Gims","MC Stojan","Milica Pavlović","Mirella","Miriam Bryant","Molly Sandén","Morat","Myles Smith","MØ","Nelli Matula","Nelly Furtado","Ness","Nina Chuba","Now United","nublu","Orr Amrami Brockman","Paulina Paukštaitytė","Pitbull","Pommelien Thijs","Preslava","Purple Disco Machine","RAYE","Red Electric","Rihanna","Rina Sawayama","Rita Ora","ROSALÍA","ROSÉ","Ruben","Sam Fender","sanah","Shade","Shakira","Shania Twain","Shaun Farrugia","Shawn Mendes","Sheppard","Sia","Sigrid","SKAAR","Static","Stefanie Heinzmann","Stromae","Tate McRae","Tea Tairović","The Script","The Travellers","The Weeknd","Theo Rose","Thorsteinn Einarsson","TINI","Tiësto","Tom Gregory","Troye Sivan","Victor Leksell","VIIVI","Wincent Weiss","Zara Larsson","Zera","Álvaro De Luna","Đana"];
const ARTIST_FOLD = new Map(ARTIST_NAMES.map((name) => [foldArtist(name), name]));
const ARTIST_KEEP = ["Sophie and the Giants", "Of Monsters And Men", "Christine and the Queens", "Florence + The Machine", "Tones and I", "Cali y El Dandee"];
function foldArtist(name) {
  return String(name).replace(/\u00a0/g, " ").normalize("NFKD").replace(/\p{M}/gu, "").toLowerCase().replace(/[^0-9a-z\u0370-\u03ff\u0400-\u04ff]+/giu, " ").replace(/\s+/g, " ").trim();
}
function artistHref(name) {
  return "artist.html?name=" + encodeURIComponent(name);
}
function artistAnchor(shown, canonical) {
  const link = document.createElement("a");
  link.className = "artist";
  link.textContent = shown;
  link.href = artistHref(canonical);
  link.title = canonical + "'s songs";
  link.addEventListener("click", (event) => event.stopPropagation());
  return link;
}
function creditPieces(credit) {
  let text = String(credit).replace(/\u00a0/g, " ");
  const held = [];
  ARTIST_KEEP.forEach((phrase) => {
    const re = new RegExp(phrase.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
    text = text.replace(re, (match) => {
      const token = "\u0001" + held.length + "\u0001";
      held.push(match);
      return token;
    });
  });
  return text.split(/(\s*(?:,|&|\+|feat\.|featuring|\bfeat\b|\bft\.?\b|\band\b)\s*|\s+\/\s+|\s+x\s+)/i).map((bit) => bit.replace(/\u0001(\d+)\u0001/g, (_, index) => held[Number(index)]));
}
function creditFragment(credit) {
  const frag = document.createDocumentFragment();
  creditPieces(credit).forEach((part) => {
    if (!part) return;
    const match = part.match(/^(\s*)([\s\S]*?)(\s*)$/);
    const core = match[2];
    const trimmed = core.replace(/^[^0-9A-Za-z\u00C0-\u024F\u0370-\u03FF\u0400-\u04FF]+/, "");
    const prefix = core.slice(0, core.length - trimmed.length);
    const name = trimmed.replace(/[^0-9A-Za-z\u00C0-\u024F\u0370-\u03FF\u0400-\u04FF]+$/, "");
    const suffix = trimmed.slice(name.length);
    if (match[1]) frag.append(match[1]);
    if (prefix) frag.append(prefix);
    const known = name ? ARTIST_FOLD.get(foldArtist(name)) : "";
    if (known) frag.appendChild(artistAnchor(name, known));
    else if (name) frag.append(name);
    if (suffix) frag.append(suffix);
    if (match[3]) frag.append(match[3]);
  });
  return frag;
}
function creditCell(tag, className, credit) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  node.appendChild(creditFragment(credit));
  return node;
}

function preferred(key) {
  return key === "points" || key === "ev" ? -1 : 1;
}

function dirLabel() {
  if (sortKey === "edition") return sortDir === 1 ? "Oldest first" : "Newest first";
  if (sortKey === "place") return sortDir === 1 ? "Best first" : "Last first";
  if (sortKey === "points" || sortKey === "ev") return sortDir === -1 ? "Highest first" : "Lowest first";
  return sortDir === 1 ? "A to Z" : "Z to A";
}

function resolveName() {
  const raw = new URLSearchParams(location.search).get("name");
  if (!raw) return "";
  return artists.find((name) => name.localeCompare(raw, "en", { sensitivity: "base" }) === 0) || null;
}

function setName(name) {
  const url = new URL(location.href);
  if (name) url.searchParams.set("name", name);
  else url.searchParams.delete("name");
  if (url.search !== location.search) history.pushState(null, "", url);
  render();
}

function songNode(row) {
  const url = row[8];
  if (!url) return text("span", "song", row[4]);
  const link = text("a", "song", row[4]);
  link.href = url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.title = "Watch on YouTube";
  return link;
}

function hodNode(name) {
  const link = text("a", "hod", name);
  link.href = "hod.html?name=" + encodeURIComponent(name);
  link.title = name + "'s songs";
  return link;
}

function countryNode(name) {
  const link = text("a", "country", name);
  link.href = "country.html?name=" + encodeURIComponent(name);
  link.title = "Songs for " + name;
  return link;
}

function editionNode(row, className) {
  const link = text("a", className || "", "STL " + row[0]);
  link.href = "scoreboard.html#" + row[0];
  return link;
}

function text(tag, className, value) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (value !== undefined) node.textContent = value;
  return node;
}

function compare(a, b) {
  const col = COLS.find((item) => item.key === sortKey);
  let diff = col.type === "text"
    ? String(a[col.index]).localeCompare(String(b[col.index]), "en", { sensitivity: "base" })
    : a[col.index] - b[col.index];
  if (diff) return diff * sortDir;
  if (a[0] !== b[0]) return a[0] - b[0];
  return a[1] - b[1];
}

function renderPeople() {
  const list = document.querySelector("#people");
  list.replaceChildren();
  artists.forEach((name) => {
    const li = document.createElement("li");
    const link = text("a", "", name);
    link.href = "artist.html?name=" + encodeURIComponent(name);
    link.addEventListener("click", (event) => {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
      event.preventDefault();
      setName(name);
    });
    li.append(link, text("span", "count", String(SONGS[name].length)));
    list.appendChild(li);
  });
}

function renderTable(rows, name) {
  const head = document.querySelector("#head");
  head.replaceChildren();
  COLS.forEach((col) => {
    const th = text("th", (col.type === "num" ? "num " : "") + (sortKey === col.key ? "sorted" : ""), col.label);
    th.scope = "col";
    th.dataset.sort = col.key;
    th.tabIndex = 0;
    th.setAttribute("aria-sort", sortKey === col.key ? (sortDir === 1 ? "ascending" : "descending") : "none");
    if (col.title) th.title = col.title;
    if (sortKey === col.key) th.append(text("span", "arrow", sortDir === 1 ? " ↑" : " ↓"));
    th.addEventListener("click", () => choose(col.key, true));
    th.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      choose(col.key, true);
    });
    head.appendChild(th);
  });
  const body = document.querySelector("#body");
  body.replaceChildren();
  rows.forEach((row) => {
    const tr = document.createElement("tr");
    if (row[1] === 1) tr.className = "winner";
    const edition = text("td", "edition");
    edition.appendChild(editionNode(row));
    const place = text("td", "num place");
    place.append(String(row[1]), text("span", "of", " of " + row[7]));
    const country = text("td", "");
    country.appendChild(countryNode(row[2]));
    const entered = text("td", "");
    entered.appendChild(hodNode(row[3]));
    const song = text("td", "song");
    song.appendChild(songNode(row));
    tr.append(
      edition,
      place,
      country,
      entered,
      song,
      creditCell("td", "credit", row[5]),
      text("td", "num points", String(row[6])),
      text("td", "num ev", String(row[9]))
    );
    body.appendChild(tr);
  });
  document.querySelector("#caption").textContent = "Songs by " + name + ", sortable by edition, place, country, head of delegation, song, credit, points, and Eurovision points";

  const cards = document.querySelector("#cards");
  cards.replaceChildren();
  rows.forEach((row) => {
    const card = document.createElement("article");
    card.className = "card" + (row[1] === 1 ? " winner" : "");
    const top = document.createElement("div");
    top.className = "top";
    const place = text("span", "place");
    place.append(String(row[1]), text("span", "of", " of " + row[7]));
    top.append(editionNode(row, "ed"), place);
    const score = document.createElement("div");
    score.className = "score";
    const ev = text("div", "ev", String(row[9]));
    ev.title = "Eurovision-scale points";
    score.append(text("div", "points", String(row[6])), ev);
    const where = document.createElement("div");
    where.className = "who";
    where.appendChild(countryNode(row[2]));
    const entered = document.createElement("div");
    entered.className = "who";
    entered.appendChild(hodNode(row[3]));
    const song = document.createElement("div");
    song.className = "song";
    song.appendChild(songNode(row));
    card.append(top, score, where, entered, song, creditCell("div", "credit", row[5]));
    cards.appendChild(card);
  });
}

function choose(key) {
  if (sortKey === key) sortDir *= -1;
  else {
    sortKey = key;
    sortDir = preferred(key);
  }
  render();
  const th = document.querySelector('thead th[data-sort="' + key + '"]');
  if (th) th.focus();
}

function render() {
  const name = resolveName();
  const rows = name ? SONGS[name].slice().sort(compare) : null;
  who.value = name || "";
  sortSelect.value = sortKey;
  dirBtn.textContent = dirLabel();
  document.querySelector("#sortline").hidden = !rows;
  document.querySelector("#people").hidden = !!rows;
  document.querySelector("#boardwrap").hidden = !rows;
  document.querySelector("#cards").hidden = !rows;
  const rule = "Place is the tie-break rank in that edition's full field. Points are the jury total. Eurovision points put that total on a 1,008-point scale. A collaboration is listed for every named artist.";
  if (!name) {
    document.title = "Songs by artist";
    document.querySelector("#kicker").textContent = "STL editions 1–63";
    document.querySelector("#title").textContent = name === null
      ? (new URLSearchParams(location.search).get("name") || "Songs")
      : "Artists";
    document.querySelector("#credit").textContent = name === null
      ? "No songs for that artist."
      : artists.length + " artists with at least three songs.";
    document.querySelector("#rule").textContent = name === null
      ? ""
      : "Choose an artist to see every song they are credited on.";
    return;
  }
  const wins = rows.filter((row) => row[1] === 1).length;
  const average = rows.reduce((sum, row) => sum + row[1], 0) / rows.length;
  const countries = new Set(rows.map((row) => row[2])).size;
  const people = new Set(rows.map((row) => row[3])).size;
  document.title = "Songs by " + name;
  document.querySelector("#kicker").textContent = "Artist · STL 1–63";
  document.querySelector("#title").textContent = name;
  document.querySelector("#credit").textContent = rows.length + (rows.length === 1 ? " song · " : " songs · ")
    + wins + (wins === 1 ? " win · " : " wins · ")
    + "average place " + (Math.round(average * 10) / 10).toFixed(1) + " · "
    + countries + (countries === 1 ? " country · " : " countries · ")
    + people + (people === 1 ? " head of delegation" : " heads of delegation");
  document.querySelector("#rule").textContent = rule;
  renderTable(rows, name);
}

who.addEventListener("change", () => setName(who.value));
sortSelect.addEventListener("change", () => {
  if (sortSelect.value === sortKey) return;
  sortKey = sortSelect.value;
  sortDir = preferred(sortKey);
  render();
});
